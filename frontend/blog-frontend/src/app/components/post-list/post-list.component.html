<div class="container mt-4">
  <h2>Articles</h2>
  <div *ngFor="let post of posts" class="card mb-3">
    <div class="card-body">
      <h5 class="card-title">{{ post.title }}</h5>
      <p class="card-text">{{ post.content | slice:0:100 }}...</p>
      <p><strong>Commentaires :</strong> {{ post.comments_count }}</p>
      <button class="btn btn-sm btn-primary me-2" (click)="toggleFavorite(post.id)">
        {{ post.is_favorite ? '★ Favori' : '☆ Marquer favori' }}
      </button>
    </div>
  </div>
</div>
